<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Smart Parking - Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            background: #f1f5f9;

            font-family:
                Arial,
                sans-serif;
        }

        .login-card {

            width: 400px;

            background: white;

            padding: 40px;

            border-radius: 16px;

            box-shadow:
                0 10px 30px
                rgba(0,0,0,0.1);
        }

        h1 {

            margin-top: 0;

            text-align: center;

            color: #111827;
        }

        .subtitle {

            text-align: center;

            color: #64748b;

            margin-bottom: 30px;
        }

        label {

            display: block;

            margin-bottom: 8px;

            font-weight: 600;
        }

        input {

            width: 100%;

            padding: 12px;

            margin-bottom: 18px;

            border: 1px solid #cbd5e1;

            border-radius: 8px;

            font-size: 15px;
        }

        button {

            width: 100%;

            padding: 13px;

            border: none;

            border-radius: 8px;

            background: #2563eb;

            color: white;

            font-size: 16px;

            font-weight: 600;

            cursor: pointer;
        }

        button:hover {

            background: #1d4ed8;
        }

        #message {

            margin-top: 15px;

            text-align: center;

            color: #dc2626;
        }

    </style>

</head>

<body>

    <div class="login-card">

        <h1>Smart Parking</h1>

        <p class="subtitle">
            Login to your dashboard
        </p>

        <form id="loginForm">

            <label>
                Username
            </label>

            <input
                type="text"
                id="username"
                required
            >

            <label>
                Password
            </label>

            <div style="position: relative;">

                <input
                    type="password"
                    id="password"
                    required
                    style="padding-right: 70px;"
                >

                <button
                    type="button"
                    id="togglePassword"
                    style="
                        position: absolute;
                        right: 8px;
                        top: 5px;
                        width: auto;
                        padding: 8px 10px;
                        background: transparent;
                        color: #2563eb;
                        font-size: 13px;
                    "
                >
                    Show
                </button>

            </div>

            <button type="submit">
                Login
            </button>

        </form>

        <div id="message"></div>

    </div>


    <script>

        const form =
            document.getElementById(
                "loginForm"
            );

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();

                const username =
                    document.getElementById(
                        "username"
                    ).value;

                const password =
                    document.getElementById(
                        "password"
                    ).value;

                const message =
                    document.getElementById(
                        "message"
                    );


                try {

                    const response =
                        await fetch(
                            "/auth/login",
                            {

                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body: JSON.stringify({

                                    username:
                                        username,

                                    password:
                                        password
                                })
                            }
                        );


                    const data =
                        await response.json();


                    if (!response.ok) {

                        message.textContent =
                            data.detail ||
                            "Login failed";

                        return;
                    }


                    // Store JWT
                    localStorage.setItem(
                        "access_token",
                        data.access_token
                    );


                    // Open dashboard
                    window.location.href =
                        "/dashboard";

                }

                catch (error) {

                    message.textContent =
                        "Unable to connect to server";

                    console.error(error);
                }

            }
        );

    </script>

</body>

</html>
